[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-market-risk-engine"
version = "1.0.0"
description = "Educational multi-asset market risk engine for reproducible VaR, ES, backtesting, and stress testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "tabulate>=0.9,<1",
  "plotly>=5.24,<7",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.64,<2",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.54,<1", "pandas-datareader>=0.10,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
market-risk = "market_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "notebooks", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
